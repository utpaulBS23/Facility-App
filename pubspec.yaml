name: facility_management_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  # UI
  cupertino_icons: ^1.0.6
  gap: ^3.0.1
  retrofit: '<4.9.0'
  # State management
  flutter_riverpod: ^2.5.1
  # Navigation
  go_router: ^17.0.1
  # Cache & Database
  shared_preferences: ^2.3.1
  # Generator and Annotations
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^3.0.0
  # Media
  flutter_svg: ^2.0.10+1
  # Logging
  logger: ^2.4.0
  pretty_dio_logger: ^1.4.0
  # Serialization & Deserialization
  dart_mappable:
  # Networking
  dio: ^5.8.0+1
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner:
  custom_lint:
  flutter_guardian:
    path: packages/flutter_guardian/
  riverpod_generator:
  riverpod_lint:
  flutter_gen_runner:
  dart_mappable_builder:
  retrofit_generator: '>=8.0.0 <10.0.0'
  freezed: ^3.0.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-VariableFont_wght.ttf
        - asset: assets/fonts/Urbanist-Italic-VariableFont_wght.ttf
          style: italic

flutter_gen:
  output: lib/src/presentation/core/gen
  line_length: 80

  integrations:
    flutter_svg: true
