name: facility_management_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.11.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # UI
  cupertino_icons: ^1.0.6
  gap: ^3.0.1
  table_calendar: ^3.1.3
  retrofit: '<4.9.0'
  # State management
  flutter_riverpod: ^2.5.1
  # Navigation
  go_router: ^17.0.1
  # Cache & Database
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.4
  # Generator and Annotations
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^3.0.0
  # Media
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  camera: ^0.11.1
  # Logging
  logger: ^2.4.0
  pretty_dio_logger: ^1.4.0
  # Serialization & Deserialization
  dart_mappable:
  # Networking
  dio: ^5.8.0+1
  #Shimmer
  shimmer: ^3.0.0
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  battery_plus: ^7.0.1
  permission_handler: ^11.3.1
  pinput: ^6.0.2
  google_mlkit_face_detection: ^0.13.2
  device_info_plus: ^12.4.0
  flutter_local_notifications: ^22.2.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner:
  custom_lint:
  flutter_guardian:
    path: packages/flutter_guardian/
  riverpod_generator:
  riverpod_lint:
  # flutter_gen_runner:
  dart_mappable_builder:
  retrofit_generator: '>=8.0.0 <10.0.0'
  freezed: ^3.0.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: MyriadPro
      fonts:
        - asset: assets/fonts/english/MYRIADPRO-REGULAR.OTF
          weight: 400
        - asset: assets/fonts/english/MyriadPro-Light.otf
          weight: 300
        - asset: assets/fonts/english/MYRIADPRO-SEMIBOLD.OTF
          weight: 600
        - asset: assets/fonts/english/MYRIADPRO-SEMIBOLDIT.OTF
          weight: 600
          style: italic
        - asset: assets/fonts/english/MYRIADPRO-BOLD.OTF
          weight: 700
        - asset: assets/fonts/english/MYRIADPRO-BOLDIT.OTF
          weight: 700
          style: italic
    - family: Kalpurush
      fonts:
        - asset: assets/fonts/bangla/kalpurush.ttf

flutter_gen:
  output: lib/src/presentation/core/gen
  line_length: 80

  integrations:
    flutter_svg: true